name: iOS → TestFlight

# Builds the React Native app in isturs-mobile-main/ and uploads it to TestFlight.
# Signing is automatic, using an App Store Connect API key (no certificates to export).
#
# Required repository secrets:
#   APPLE_TEAM_ID        10-character Team ID (developer.apple.com → Membership)
#   ASC_KEY_ID           App Store Connect API key ID
#   ASC_ISSUER_ID        App Store Connect API issuer ID
#   ASC_KEY_P8           Full contents of the AuthKey_XXXX.p8 file

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'isturs-mobile-main/isturs-mobile-main/**'
      - '.github/workflows/ios-testflight.yml'

concurrency:
  group: ios-testflight
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: isturs-mobile-main/isturs-mobile-main

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: isturs-mobile-main/isturs-mobile-main/package-lock.json

      - name: Check Firebase config
        run: |
          test -f ios/rntemplate/GoogleService-Info.plist || {
            echo "::error::ios/rntemplate/GoogleService-Info.plist is missing. Download it from the Firebase console (iOS app com.digsecvip.isturs)."
            exit 1
          }

      - name: Install JS dependencies
        run: npm ci

      - name: Install pods
        working-directory: isturs-mobile-main/isturs-mobile-main/ios
        run: pod install --repo-update

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          echo "$ASC_KEY_P8" > "$RUNNER_TEMP/asc_key.p8"

      - name: Archive
        working-directory: isturs-mobile-main/isturs-mobile-main/ios
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace rntemplate.xcworkspace \
            -scheme rntemplate \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Isturs.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc_key.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|warning: .*signing|\*\* ARCHIVE" || true
          test -d "$RUNNER_TEMP/Isturs.xcarchive" || { tail -200 "$RUNNER_TEMP/archive.log"; exit 1; }

      - name: Export and upload to TestFlight
        working-directory: isturs-mobile-main/isturs-mobile-main/ios
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Isturs.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc_key.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-archive-log
          path: ${{ runner.temp }}/archive.log
          if-no-files-found: ignore

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc_key.p8"
